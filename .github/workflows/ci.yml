name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab (or the API) on any branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Chromium, software WebGL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tandem .
      - name: Start the container and check what it serves
        run: |
          docker run -d --name tandem -p 8787:8787 tandem
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:8787/api/health | grep -q '"ok":true'
          curl -fsS http://localhost:8787/ | grep -qi '<title>Tandem'
          curl -fsS http://localhost:8787/app/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8787/app/sw.js | grep -q 'tandem-'
          curl -fsSI http://localhost:8787/app/ | grep -qi '^content-security-policy:'
      - if: always()
        run: docker logs tandem || true
